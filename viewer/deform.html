<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eris · 互動展示</title>
<style>
:root{
  --panel-w:290px;
  --panel-bg:#101319ed;
  --border:#53606b;
  --accent:#7ee8ff;
  --text:#eee;
  --muted:#adb9c5;
  --btn-bg:#26323e;
  --btn-border:#77818c;
  --input-accent:#7ee8ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#282c33;color:var(--text);font:14px system-ui}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stage{background-color:#343840;background-image:linear-gradient(45deg,#3c424a 25%,transparent 25%),linear-gradient(-45deg,#3c424a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3c424a 75%),linear-gradient(-45deg,transparent 75%,#3c424a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
header{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-around;pointer-events:none;z-index:10}
header span{background:#000a;padding:7px;border-radius:8px;font-size:12px}

/* Collapsible side panel */
.side-panel{
  position:fixed;
  top:0; right:calc(var(--panel-w) * -1);
  width:var(--panel-w);
  height:100vh;
  background:var(--panel-bg);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:right .3s cubic-bezier(.25,.46,.45,.94);
  z-index:100;
  overflow:hidden;
}
.side-panel.open{right:0}
.panel-tabs{display:flex;background:#0a0c10;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-tab{
  flex:1;padding:12px 8px;background:transparent;border:none;color:var(--muted);
  font-size:12px;cursor:pointer;transition:color .15s,border-bottom .15s;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;display:none}
.panel-content.active{display:block}
.panel-section{margin-bottom:10px;border:1px solid var(--border);border-radius:7px;padding:8px}
.panel-section summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px;list-style-position:inside}
.panel-section h2{font-size:13px;font-weight:600;color:var(--accent);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
#face-candidate-controls h2{display:none}
.panel-section:last-child{margin-bottom:0}

label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
input[type=range]{width:145px;accent-color:var(--input-accent)}
button,select{padding:6px 10px;background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border);border-radius:5px;font-size:13px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
small{display:block;color:var(--muted);margin:8px 0;font-size:11px;line-height:1.4}
output{width:27px;text-align:right;font-size:12px}
h1{font-size:15px;margin:0 0 4px}
h1 small{font-size:11px;color:var(--muted);font-weight:400}

/* Layer list */
.layer-list{display:flex;flex-direction:column;gap:6px}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0a0c10;border:1px solid var(--btn-border);border-radius:6px;transition:background .15s,border-color .15s}
.layer-item:hover{background:#12151c;border-color:var(--accent)}
.layer-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--input-accent);flex-shrink:0;cursor:pointer}
.layer-item .layer-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-item .layer-badge{font-size:10px;padding:1px 6px;background:#1e242b;border:1px solid var(--btn-border);border-radius:3px;color:var(--muted);white-space:nowrap}

/* Toggle button */
.panel-toggle{
  position:fixed;
  top:50%; right:0;
  transform:translateY(-50%);
  width:36px;height:100px;
  background:var(--panel-bg);
  border:1px solid var(--border);
  border-right:none;
  border-radius:10px 0 0 10px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:101;
  transition:background .2s,box-shadow .2s;
}
.panel-toggle:hover{background:#151920;box-shadow:-4px 0 16px rgba(0,0,0,.4)}
.panel-toggle svg{width:20px;height:20px;stroke:var(--accent);transition:transform .3s}
.panel-toggle span{display:none;color:var(--accent);font-size:12px}
.side-panel.open + .panel-toggle svg{transform:rotate(180deg)}

/* Responsive */
@media(max-width:900px){
  :root{--panel-w:100vw}
  .side-panel{width:100vw;height:min(65dvh,600px);top:auto;bottom:calc(-1 * min(65dvh,600px));right:0;border-left:0;border-top:1px solid var(--border);transition:bottom .3s}
  .side-panel.open{bottom:0}
  header{font-size:11px}
  .panel-toggle{display:flex;gap:5px;top:auto;bottom:0;right:12px;transform:none;width:94px;height:34px;border-radius:8px 8px 0 0;border:1px solid var(--border)}
  .panel-toggle span{display:inline}
}
</style>

<canvas id="stage"></canvas>
<canvas id="guides" style="pointer-events:none"></canvas>

<header>
  <span id="left-title">Eris · 單人展示</span>
</header>

<!-- Collapsible Side Panel -->
<div class="side-panel" id="sidePanel">
  <div class="panel-tabs" role="tablist">
    <button class="panel-tab active" role="tab" data-tab="controls" aria-selected="true">動態控制</button>
    <button class="panel-tab" role="tab" data-tab="layers" aria-selected="false">圖層開關</button>
  </div>

  <div class="panel-content active" id="tab-controls" role="tabpanel">
    <details class="panel-section" open><summary>姿勢與動態</summary>
      <select id="compare" hidden><option value="rigid" selected>單人展示</option></select>
      <label>身體側傾<input id="body" type="range" min="-100" max="100" value="0"><output></output></label>
      <label>上身側彎<input id="torso" type="range" min="-100" max="100" value="0"><output></output></label>
      <label>頭部側傾<input id="head" type="range" min="-100" max="100" value="0"><output></output></label>
      <label>呼吸起伏<input id="breath" type="range" min="0" max="100" value="30"><output></output></label>
      <label>髮絲擺動<input id="hair" type="range" min="0" max="100" value="10"><output></output></label>
      <label>動態強度<input id="energy" type="range" min="0" max="100" value="55"><output></output></label>
      <label>胸部起伏<input id="bust" type="range" min="0" max="100" value="50"><output></output></label>
    </details>

    <details class="panel-section"><summary>頭部與視線</summary>
      <label>頭部左右微轉<input id="yaw" type="range" min="-100" max="100" value="0"><output></output></label>
      <label>視線左右<input id="gaze-x" type="range" min="-100" max="100" value="0"><output></output></label>
      <label>視線上下<input id="gaze-y" type="range" min="-100" max="100" value="0"><output></output></label>
      <label><span>眼球跟隨滑鼠</span><input id="gaze-follow" type="checkbox" checked></label>
      <label>眨眼<input id="blink" type="range" min="0" max="100" value="0"><output></output></label>
      <label><span>自動眨眼</span><input id="auto-blink" type="checkbox" checked></label>
      <button id="blink-now">眨眼一次</button>
    </details>

    <details class="panel-section" id="face-candidate-controls" hidden><summary>表情與口型</summary>
      <h2>口型與表情 · 候選預覽</h2>
      <label>表情<select id="face-emotion"></select></label>
      <label>口型<select id="face-mouth"></select></label>
      <label><span>自動試播口型</span><input id="face-talk" type="checkbox"></label>
      <small hidden></small>
    </details>

    <details class="panel-section" open><summary>待機與檢視</summary>
      <label><span>待機擺動</span><input id="idle" type="checkbox" checked></label>
      <label><span>跟隨滑鼠</span><input id="follow" type="checkbox" checked></label>
      <label>檢查視角<select id="view"><option value="full">全身</option><option value="upper">上半身放大</option></select></label>
      <label><span>暫停時間</span><input id="paused" type="checkbox"></label>
      <label><span>顯示錨點／過渡區</span><input id="show-guides" type="checkbox"></label>
      <button id="neutral">回到原位</button>
      <button id="defaults">恢復預設</button>
    </details>

    <details class="panel-section"><summary>角色校正</summary>
      <label><span>點選校正</span><input id="calibrate" type="checkbox"></label>
      <label>錨點<select id="anchor"><option value="head">頭／頸</option><option value="torso">上身／腰</option><option value="body">全身支點</option><option value="frontHair">前髮根</option><option value="backHair">後髮根</option></select></label>
      <label>頭部上限<input id="head-limit" type="range" min="2" max="8" step="0.5" value="6"><output>6°</output></label>
      <button id="save">保存設定</button>
      <button id="export">匯出 JSON</button>
      <label>匯入 JSON<input id="import" type="file" accept=".json" style="width:155px"></label>
      <button id="reset-rig">恢復角色設定</button>
      <small id="settings-status"></small>
    </details>

    <a id="legacy">開啟第一階段</a>
    <p id="status">載入中…</p>
  </div>

  <div class="panel-content" id="tab-layers" role="tabpanel">
    <section class="panel-section">
      <h2>基礎 17 層</h2>
      <div class="layer-list" id="layer-list-base"></div>
    </section>
    <section class="panel-section">
      <h2>Rig 獨立資產</h2>
      <div class="layer-list" id="layer-list-rig"></div>
    </section>
  </div>
</div>

<!-- Panel toggle button -->
<button class="panel-toggle" id="panelToggle" aria-label="切換控制面板" title="切換控制面板">
  <span>面板</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>

<script type="module" src="/viewer-assets/deform-preview.mjs?v=48"></script>
</html>

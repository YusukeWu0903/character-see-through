<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色協調動作 · 實驗版</title>
<style>
body{margin:0;background:#15181d;color:#eee;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-around;pointer-events:none}header span{background:#000a;padding:7px;border-radius:8px}
aside{position:fixed;bottom:12px;right:12px;background:#101319ed;padding:16px;border:1px solid #53606b;border-radius:12px;width:270px;max-height:70vh;overflow:auto}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}input[type=range]{width:145px;accent-color:#7ee8ff}button,select{padding:6px;background:#26323e;color:white;border:1px solid #77818c;border-radius:5px}a{color:#7ee8ff}small{display:block;color:#adb9c5;margin:8px 0}#status{font-size:12px;white-space:pre-wrap}output{width:27px;text-align:right}h1{font-size:16px;margin:0}
@media(max-width:900px){aside{left:12px;width:auto;max-height:30vh}header{font-size:11px}}
</style>
<canvas id="stage"></canvas>
<header><span id="left-title">雲端素材 · 協調動作</span><span>本機素材 · 協調動作</span></header>
<aside>
<h1>協調動作 · 第一階段</h1>
<small>目前為 Eris 專用側傾設定，尚非立體轉頭。</small>
<label>對照<select id="compare"><option value="cloud">雲端／本機，同步姿勢</option><option value="legacy">同一本機素材，舊動作／新動作</option></select></label>
<label>身體側傾<input id="body" type="range" min="-100" max="100" value="0"><output></output></label>
<label>頭部側傾<input id="head" type="range" min="-100" max="100" value="0"><output></output></label>
<label>呼吸起伏<input id="breath" type="range" min="0" max="100" value="30"><output></output></label>
<label>髮絲擺動<input id="hair" type="range" min="0" max="100" value="10"><output></output></label>
<label><span>待機擺動</span><input id="idle" type="checkbox" checked></label>
<label><span>滑鼠跟隨</span><input id="follow" type="checkbox" checked></label>
<label><span>暫停時間</span><input id="paused" type="checkbox"></label>
<button id="neutral">回到原位</button> <button id="defaults">恢復預設</button>
<small>移動滑鼠可帶動角色；靜止時會輕微擺動。側傾滑桿調整姿勢偏移，關閉待機與跟隨可單獨調整。五官跟隨頭部；鞋跟隨腿。舊動作對照時，左側保留原本預設幅度與滑鼠視差。</small>
<a id="legacy">開啟里程碑原版</a>
<p id="status">載入中…</p>
</aside>
<script type="module" src="/viewer-assets/preview.mjs?v=2"></script>
</html>
